- aid: pricefinder:pricefinder-event-subscriptions-api
  name: Pricefinder Property Event Subscriptions API
  description: Subscribe, list and delete property event alerts for ForSale, ForRent, Sold
    and SoldVerified event types, per property or for the current user. The documentation
    states these are delivered as email notifications only — there is no webhook callback
