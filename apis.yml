- aid: pricefinder:pricefinder-sales-rentals-listings-api
  name: Pricefinder Sales, Rentals & Listings API
  description: Retrieval of individual sale, rental and listing records by identifier, and
    enumeration of sales, rentals and listings scoped by suburb, postcode, street or spatial
    boundary. Backed by Domain and Allhomes first-party listing feeds and government sale
