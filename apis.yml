apis:
- aid: pricefinder:pricefinder-property-api
  name: Pricefinder Property API
  description: Property record retrieval for Australian properties — core and extended property
    detail, images, floorplans, street view, maps, schools, radial searches for nearby sales,
    rentals, listings, properties and development applications, and PDF property reports.
    22 documented operations under the `properties` tag, plus image, feature and localisation
    stub endpoints.
