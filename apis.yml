- aid: pricefinder:pricefinder-suburb-statistics-api
  name: Pricefinder Suburb & Market Statistics API
  description: Suburb-level market intelligence — suburb detail and summary, demographics,
    flyover reports and PDFs, street enumeration, peak selling periods, sale price segmentation,
    and time series for sales, rentals and price segmentation by property type. 15 documented
    operations under the `suburbs` tag.
  humanURL: https://api.pricefinder.com.au/v1/swagger/index.html
