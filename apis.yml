aid: pricefinder
url: https://raw.githubusercontent.com/api-evangelist/pricefinder/refs/heads/main/apis.yml
name: Pricefinder
kind: company
description: Pricefinder is an Australian property intelligence and valuation platform operating
  at pricefinder.com.au, supplying property records, comparable sales and rental history,
  suburb statistics, AVM-powered price estimates and CMA/appraisal reports to real estate
  agencies, mortgage brokers, banks and lenders, valuers, property developers, advisory firms
  and government. Its home market is Australia and it sits on the data side of the value chain
  rather than the portal side — it blends Domain and Allhomes first-party listing feeds with
  state and territory government land valuation and sales data plus third-party mapping, then
  resells that as reports, a web application and an API. Pricefinder is a brand of Domain
  Holdings Australia, which CoStar Group completed the acquisition of in August 2025, so it
  now sits inside the same group as Domain, Allhomes and Commercial Real Estate. Its API posture
  is unusually honest for this sector — the full machine-readable contract is genuinely public.
  A complete Swagger 2.0 document (v1.13.1, 112 paths, 188 definitions, 19 tags) and an interactive
  Swagger UI are served anonymously from api.pricefinder.com.au, and OAuth 2.0 client_credentials,
  authorization_code and refresh_token flows are documented in full. But every data path returns
  401 without credentials, and credentials are not self-serve — there is no developer signup,
  only industry "Get started" forms that route to sales for a custom, minimum-one-month commercial
  subscription governed by the Domain Group API Terms and Conditions. Australia has no MLS
  system and no RESO regime — no RESO Web API or Data Dictionary certification, no OData $metadata
  document and no Universal Property Identifier appears anywhere in Pricefinder's contract
  or documentation. The land-registry seam shows up instead as state-specific title reference
  lookups (NSW/VIC/QLD/SA/WA/TAS/NT/ACT plan, lot, section, volume and folio paths).
