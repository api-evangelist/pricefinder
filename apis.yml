- aid: pricefinder:pricefinder-title-reference-api
  name: Pricefinder Title & Land Reference API
  description: State-by-state resolution of Australian land title references to Pricefinder
    property records — NSW, VIC, QLD, SA, WA, TAS, NT and ACT plan/planType, lot, section,
    volume, folio and division lookups, plus QLD title retrieval by property identifier. 25
    documented operations under the `references` tag; this is the land-registry seam expressed
    as an API.
  humanURL: https://api.pricefinder.com.au/v1/swagger/index.html
  baseURL: https://api.pricefinder.com.au/v1
