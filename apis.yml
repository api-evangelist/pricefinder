- aid: pricefinder:pricefinder-avm-api
  name: Pricefinder AVM & Valuation API
  description: Automated valuation model output for a property, returned as JSON via GET /properties/{propertyId}/avm
    against the AVM schema, and as a rendered PDF via /properties/{propertyId}/avm/pdf. Auto-CMA
    sale and rental PDFs are generated from the same property identifier. This is the valuation
    surface Pricefinder markets to lenders, valuers and advisory firms.
  humanURL: https://api.pricefinder.com.au/v1/swagger/index.html
  baseURL: https://api.pricefinder.com.au/v1
