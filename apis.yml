- aid: pricefinder:pricefinder-oauth2-api
  name: Pricefinder OAuth 2.0 Token API
  description: 'POST /oauth2/token issuing access and refresh tokens for three documented
    grant types: client_credentials (API user''s own username and password, HTTP Basic accepted
    as an alternative to form parameters), authorization_code (third-party delegated access
    via the hosted authorize page at /v1/auth/authorize.html) and refresh_token. Tokens are
    presented as an Authorization: Bearer header or an access_token query parameter. No OpenID
    Connect discovery document is served.'
  humanURL: https://api.pricefinder.com.au/v1/swagger/index.html
  baseURL: https://api.pricefinder.com.au/v1
