        boundingBox:
          $ref: '#/components/schemas/Rectangle'
        streetLocation:
          $ref: '#/components/schemas/StreetLocation'
        buildingName:
          type: string
        streetDisplay:
          type: string
        altStreetDisplay:
          type: string
        propertyArea:
          type: number
          format: double
        buildingArea:
          type: number
          format: double
        saleAmount:
          type: number
          format: double
        displayPrice:
