        governmentSale:
          type: boolean
        saleType:
          type: string
        marketStatus:
          type: string
        landUses:
          type: string
        beds:
          type: integer
          format: int32
        baths:
          type: integer
          format: int32
        cars:
          type: integer
          format: int32
        mainImage:
          $ref: '#/components/schemas/MainImage'
        owners:
          type: string
        state:
          type: string
        propertyType:
          type: string
    PropertyIdentifier:
      type: object
      properties:
        id:
          type: integer
          format: int64
        matchlevel:
          type: string
          enum:
          - suburb
          - street
          - property
        location:
          $ref: '#/components/schemas/Point'
        parent:
          type: boolean
        _self:
          type: string
    TypeAheadSuggestions:
      type: object
      properties:
        disclaimer:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/TypeAheadSuggestion'
    StreetLocation:
      type: object
      properties:
        streetId:
          type: string
        fullCompleteAddress:
          type: string
        fullStreetName:
          type: string
        streetName:
          type: string
        streetAddress:
          type: string
        postcode:
          type: string
        localityId:
          type: string
        localityName:
          type: string
        lgaId:
          type: string
        lgaName:
          type: string
        state:
          type: string
    SuggestMatch:
      type: object
      properties:
        property:
          $ref: '#/components/schemas/PropertyIdentifier'
        street:
          $ref: '#/components/schemas/StreetIdentifier'
        suburb:
          $ref: '#/components/schemas/SuburbIdentifier'
        type:
          type: string
          enum:
          - property
          - street
          - suburb
          - typeahead
        display:
          type: string
        legalDescription:
