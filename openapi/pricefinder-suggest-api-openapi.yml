          format: double
    SuggestMatches:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: '#/components/schemas/SuggestMatch'
        disclaimer:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    TypeAheadSuggestion:
      type: object
      properties:
        legacyPropertyId:
          type: integer
          format: int32
        unitNumber:
          type: string
        streetNumber:
          type: string
        streetName:
          type: string
        streetType:
          type: string
        streetTypeLong:
          type: string
        suburb:
          type: string
        postcode:
          type: string
        state:
          type: string
        id:
          type: string
        urlSlug:
          type: string
        pdsId:
          type: integer
          format: int64
        address:
          type: string
        relativeScore:
          type: integer
          format: int32
        score:
          type: number
          format: double
        additionalProperties:
          type: object
          additionalProperties:
            type: object
    Address:
      type: object
      properties:
        street:
          type: string
        unit:
          type: string
        level:
          type: string
        lot:
          type: string
        streetNumber:
          type: string
        streetAddress:
          type: string
        locality:
          type: string
        streetLocation:
          type: string
        state:
          type: string
        postcode:
          type: string
        countryCode:
          type: string
        streetName:
          type: string
        streetSuffix:
          type: string
        streetType:
          type: string
        lga:
          type: string
    Rectangle:
      type: object
      properties:
        min:
          $ref: '#/components/schemas/LonLat'
        max:
          $ref: '#/components/schemas/LonLat'
    StreetIdentifier:
      type: object
      properties:
        id:
          type: string
    SuggestLonLatResultPropertyByLonLat:
      type: object
      properties:
        disclaimer:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        matchesCount:
          type: integer
          format: int64
        latLon:
          $ref: '#/components/schemas/Point'
        matches:
          type: array
          items:
            $ref: '#/components/schemas/PropertyByLonLat'
