    LonLat:
      type: object
      properties:
        lon:
          type: number
          format: double
        lat:
          type: number
          format: double
    MainImage:
      type: object
      properties:
        imageId:
          type: integer
          format: int64
        imageScheme:
          type: string
    Message:
      type: object
      properties:
        code:
          type: integer
          format: int64
        text:
          type: string
    Point:
      type: object
      properties:
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
    PropertyByLonLat:
      type: object
      properties:
        propertyId:
          type: integer
          format: int64
        legalDescription:
          type: string
        srcPropertyId:
          type: string
        srcAddressId:
          type: string
        zonings:
          type: string
        saleId:
          type: integer
          format: int64
        source:
          type: string
        matchLevel:
