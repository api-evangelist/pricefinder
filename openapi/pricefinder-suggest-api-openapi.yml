      description: ''
      operationId: suggest
      parameters:
      - name: q
        in: query
        description: Address search query
        required: true
        pds:
          hidden: false
          extra: false
          enumerate: false
          deprecated: false
        schema:
          type: string
      - name: currentState
        in: query
        required: false
        pds:
          hidden: false
          extra: true
          enumerate: false
          deprecated: false
        schema:
          type: string
      - name: match_ids
        in: query
        required: false
        pds:
          hidden: false
          extra: true
          enumerate: false
          deprecated: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: successful operation
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestMatches'
    servers:
    - url: /v1
  /suggest/lonlat:
    get:
      tags:
      - suggest
      description: ''
      operationId: suggestLonLat
      parameters:
