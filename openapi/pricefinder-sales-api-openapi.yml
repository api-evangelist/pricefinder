openapi: 3.2.0
info:
  title: Pricefinder Sales API
  version: 1.13.1
  contact:
    name: Pricefinder
  license:
    name: Terms and Conditions
    url: https://www.domain.com.au/group/api-terms-and-conditions/
  description: 'Operations tagged sales across 2 of this provider''s published API definitions: pricefinder-api-swagger.json, pricefinder-api-swagger.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1
tags:
- name: sales
paths:
  /sales/{saleId}:
    get:
      tags:
      - sales
      description: ''
      operationId: sale
      parameters:
      - name: saleId
        in: path
        required: true
        pds:
          hidden: false
          extra: false
          enumerate: false
          deprecated: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: successful operation
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedSale'
    servers:
    - url: /v1
components:
  schemas:
    Purchaser:
      type: object
      properties:
        firstName:
          type: string
        surname:
          type: string
        address:
          $ref: '#/components/schemas/Address'
    SensitivePrice:
      type: object
      properties:
        display:
          type: string
        value:
          type: number
          format: double
        rawValue:
          type: number
          format: double
        withheld:
          type: boolean
    SuburbIdentifier:
