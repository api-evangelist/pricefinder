openapi: 3.2.0
info:
  description: Pricefinder API provides access to property, sale and listing searches as well as suburb statistics and SSO to the Pricefinder website capabilities.
  version: 1.13.1
  title: PriceFinder API v1.13.1 Appraisals API
  contact:
    name: Pricefinder
  license:
    name: Terms and Conditions
    url: https://www.domain.com.au/group/api-terms-and-conditions/
servers:
- url: /v1
tags:
- name: Appraisals
paths:
  /appraisals:
    get:
      tags:
      - Appraisals
      description: ''
      operationId: appraisals
      parameters:
      - name: agentId
        in: query
        required: false
        pds:
          hidden: false
          extra: false
          enumerate: false
          deprecated: false
        schema:
          type: integer
          format: int64
      - name: date_end
        in: query
        description: The default range value is 30 days. date format 'now', 'today-xxd' or 'year-month-day'
        required: false
        pds:
          hidden: false
          extra: true
          enumerate: false
          deprecated: false
        schema:
          type: string
          format: date-time
          default: now
      - name: date_start
        in: query
        description: The default range value is 30 days. date format 'now', 'today-xxd' or 'year-month-day'
        required: false
        pds:
          hidden: false
          extra: true
          enumerate: false
          deprecated: false
        schema:
          type: string
          format: date-time
          default: today-30d
      - name: limit
        in: query
        description: The limit must be greater than '0'. Otherwise, the default value '10' will be used
        required: false
        pds:
          hidden: false
          extra: true
          enumerate: false
          deprecated: false
        schema:
          type: integer
          format: int64
          default: 100
      - name: page
        in: query
        description: The default value is '1', less than '1' will be ignored
        required: false
        pds:
          hidden: false
          extra: true
          enumerate: false
          deprecated: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: propertyId
        in: query
        required: false
        pds:
          hidden: false
          extra: false
          enumerate: false
          deprecated: false
        schema:
          type: integer
          format: int64
      - name: sort
        in: query
        description: The limit must be greater than '0'. Otherwise, the default value '10' will be used
        required: false
        pds:
          hidden: false
          extra: true
          enumerate: false
          deprecated: false
        style: form
        explode: true
        schema:
          type: array
          format: -?\w+
          items:
            type: string
          enum:
          - date
          - -date
      - name: type
        in: query
        required: false
        pds:
          hidden: false
          extra: false
          enumerate: false
          deprecated: false
        schema:
          type: string
          enum:
          - RENTAL_CMA
          - SALES_CMA
          - SOI
      responses:
        '200':
          description: successful operation
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appraisals'
      summary: Appraisals
      x-summary-source: derived
  /appraisals/agent/image/{agentId}:
    get:
      tags:
      - Appraisals
