openapi: 3.2.0
info:
  title: Pricefinder Features API
  version: 1.13.1
  contact:
    name: Pricefinder
  license:
    name: Terms and Conditions
    url: https://www.domain.com.au/group/api-terms-and-conditions/
  description: 'Operations tagged features across 2 of this provider''s published API definitions: pricefinder-api-swagger.json, pricefinder-api-swagger.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /v1
tags:
- name: features
paths:
  /features:
    get:
      tags:
      - features
      description: ''
      operationId: getFeatures
      responses:
        '200':
          description: successful operation
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFeatures'
    servers:
    - url: /v1
components:
  schemas:
    Feature:
      type: object
      properties:
        feature:
          type: string
        hasAccess:
          type: boolean
    UserFeatures:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        features:
          type: array
          items:
            $ref: '#/components/schemas/Feature'
x-refined-from:
- pricefinder-api-swagger.json
- pricefinder-api-swagger.yml
