        format: "int64"
        pds:
          hidden: false
          extra: true
          enumerate: false
          deprecated: false
      - name: "match_method"
        in: "query"
        required: false
        type: "string"
        default: "startswith"
        enum:
        - "startswith"
        - "exact"
        pds:
          hidden: false
          extra: true
          enumerate: false
          deprecated: false
      - name: "max_area"
