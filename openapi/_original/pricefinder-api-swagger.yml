        format: "int64"
        pds:
          hidden: false
          extra: false
          enumerate: false
          deprecated: false
      responses:
        "200":
          description: "The request has succeeded with event subscriptions available"
          schema:
            $ref: "#/definitions/PropertyEventSubscription"
        "204":
          description: "The request has succeeded but no events subscribed"
        "404":
          description: "Property not found"
          schema:
            $ref: "#/definitions/Error"
    post:
      tags:
      - "subscriptions"
      summary: ""
      description: "Subscribe to property event alerts (currently only available through\
        \ email notifications) for this property.<br><b>Note: This endpoint is NOT\
