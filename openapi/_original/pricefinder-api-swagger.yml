  /eventsubscriptions/properties:
    post:
      tags:
      - "subscriptions"
      summary: ""
      description: "Subscribe to property event alerts (currently only available through\
        \ email notifications) for those properties.<br><b>Note: This endpoint is\
        \ NOT additive</b> <br>i.e. Multiple calls to this endpoint on the same property\
        \ will keep overwriting the subscription with the eventTypes passed in the\
        \ latest request.<br><b>Example :</b> <br> <ul><li>Subscribe to property X\
        \ for 'ForSale' event</li><li>Subscribe to property X for 'ForRent' event</li><li>After\
        \ these 2 calls X is only subscribed for 'ForRent'</li></ul>"
      operationId: "propertiesEventsSubscribe"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      - "application/json"
      parameters:
      - in: "body"
        name: "body"
        required: false
        schema:
          $ref: "#/definitions/EventSubcriptionParameters"
      - name: "propertyIds"
        in: "query"
        description: "The available eventTypes are <b>ForSale</b>, <b>ForRent</b>\
          \ and <b>Sold</b>. They are case sensitive."
        required: false
        type: "array"
        items:
          type: "integer"
          format: "int64"
        collectionFormat: "multi"
        pds:
          hidden: false
          extra: false
          enumerate: false
          deprecated: false
      responses:
        default:
          description: "successful operation"
