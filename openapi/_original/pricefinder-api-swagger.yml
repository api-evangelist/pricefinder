          extra: false
          enumerate: false
          deprecated: false
      - name: "sort"
        in: "query"
        description: "The limit must be greater than '0'. Otherwise, the default value\
          \ '10' will be used"
        required: false
        type: "array"
        items:
          type: "string"
        collectionFormat: "multi"
        format: "-?\\w+"
        enum:
        - "date"
        - "-date"
        pds:
          hidden: false
          extra: true
          enumerate: false
          deprecated: false
      - name: "type"
        in: "query"
        required: false
        type: "string"
        enum:
        - "RENTAL_CMA"
        - "SALES_CMA"
        - "SOI"
        pds:
          hidden: false
          extra: false
          enumerate: false
          deprecated: false
