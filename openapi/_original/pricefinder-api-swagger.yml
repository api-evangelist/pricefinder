          hidden: false
          extra: false
          enumerate: false
          deprecated: false
      - name: "date_end"
        in: "query"
        description: "The default range value is 30 days. date format 'now', 'today-xxd'\
          \ or 'year-month-day'"
        required: false
        type: "string"
        default: "now"
        format: "date-time"
        pds:
          hidden: false
          extra: true
          enumerate: false
          deprecated: false
      - name: "date_start"
        in: "query"
        description: "The default range value is 30 days. date format 'now', 'today-xxd'\
          \ or 'year-month-day'"
        required: false
        type: "string"
        default: "today-30d"
        format: "date-time"
        pds:
          hidden: false
          extra: true
          enumerate: false
          deprecated: false
      - name: "limit"
        in: "query"
        description: "The limit must be greater than '0'. Otherwise, the default value\
          \ '10' will be used"
        required: false
        type: "integer"
        default: 100
        format: "int64"
        pds:
          hidden: false
          extra: true
          enumerate: false
          deprecated: false
      - name: "page"
        in: "query"
        description: "The default value is '1', less than '1' will be ignored"
        required: false
        type: "integer"
        default: 1
        format: "int32"
        pds:
          hidden: false
          extra: true
          enumerate: false
          deprecated: false
