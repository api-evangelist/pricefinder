    note: Same 112 paths as the JSON serialization; confirmed identical path set. Two
      files, one contract.

contractShape:
  basePath: /v1
  resolvedBaseURL: https://api.pricefinder.com.au/v1
  baseURLNote: The spec declares no `host` and no `schemes`; the absolute base URL is
    taken from the provider's own documented curl example in the /oauth2/token
    description and confirmed by live probes.
  httpMethods: Predominantly GET. POST appears only on /oauth2/token, event
    subscriptions, /events/cmaEvent/{cmaId} and /properties/{id}/images/streetview;
    DELETE only on event subscriptions. There is no write path into listings,
    valuations or property records — this is a read/report API.
  declaredTags:
    subscriptions: 5
    references: 25
    sso: 9
    properties: 22
    postcodes: 4
    images: 1
    suburbs: 15
    sales: 1
    rentals: 1
    listings: 1
    spatial: 4
    names: 3
    suggest: 6
    events: 1
    appraisals: 11
    stubs: 1
    streets: 4
    features: 1
    oauth2: 1
  productSegmentation: |
    The segmentation in apis.yml mirrors the provider's own Swagger tags exactly — no
    grouping was invented. Mapped to the sector taxonomy: listings/search = suggest,
    spatial, names, listings; property records = properties, images, streets,
    postcodes; valuation/AVM = /properties/{id}/avm and /avm/pdf plus autocma PDFs;
    transactions = sales, rentals; documents = the PDF report endpoints and
    appraisals (CMA, rental CMA, statement of information); title/land registry =
    references. There is no tenancy/property-management surface and no payments
    surface — Pricefinder does not touch money or conveyancing settlement (PEXA is
    the Australian rail for that, and Pricefinder does not integrate with it in this
    contract).

webhooksEventsSdksPostman:
  webhooks: |
    None. Absence is the finding. The `subscriptions` tag looks like webhooks but is
    not: POST /eventsubscriptions/properties states plainly that property event alerts
    are "currently only available through email notifications". Event types are
    ForSale, ForRent, Sold and SoldVerified. There is no callback URL parameter, no
    signing secret, no delivery/retry semantics and no HTTP push anywhere in the
    contract. The string "webhook" appears zero times in swagger.json.
  streamingOrAsync: None. No WebSocket, SSE, or message-queue surface is documented.
    No AsyncAPI.
  officialSDKs: |
    None published by Pricefinder. No SDK, client library, CLI or code-sample
    repository was found on any Pricefinder or Domain property. A third-party Ruby
    client exists at github.com/realhub/pricefinder-ruby, maintained by Realhub, not
    by Pricefinder — recorded as community, not official.
  postmanCollection: None found. No Postman workspace, collection or "Run in Postman"
    button on any reachable Pricefinder surface.
  changelog: None published. Version 1.13.1 is visible only in the spec's `info.version`;
    no release notes, deprecation policy or version history is served.
  statusPage: None. status.pricefinder.com.au does not resolve.
  integrations: |
    Pricefinder publishes a partner integrations directory at
    https://www.pricefinder.com.au/integrations/ (HTTP 200) listing CRM, forms,
    proposal and agreement partners — Rex Software, SalesTrekker, Realtair, LockedOn,
    Aro Software, Engage, Real Time Agent, REI Forms Live, Realworks, Forms Live —
    with a "Become an integration partner" call to action. These are commercial
    partnerships built on the same gated API, not a public app marketplace.

findings:
  headline: |
    Pricefinder is the cleanest example in this study of a provider whose CONTRACT is
    open and whose DATA is closed. The 112-path Swagger 2.0 document is downloadable
    by anyone, in two serializations, with no authentication — you can read every
    operation, every one of 188 schemas, and the complete OAuth2 prose before you ever
    speak to a salesperson. Then every call returns 401 and the only way forward is a
    negotiated commercial subscription.
  reso: |
    RESO is absent, and that is the correct answer for Australia. There is no MLS to
    certify against, no NAR, no IDX or VOW licence, and no association membership in
    the path. What replaces RESO here is not a standard at all but a proprietary
    integer propertyId, reconciled to eight different state and territory land-title
    reference schemes through 25 bespoke lookup paths — a per-jurisdiction adapter
    layer standing in for the interoperability RESO's Data Dictionary provides in the
    United States.
  gateVsCertification: |
    The two facts to keep separate: reachability of the contract (excellent — 200,
    anonymous, parses, complete) and reachability of the data (application-approval,
    sales-led, minimum one-month commercial term, Domain Group API Terms and
    Conditions). Neither implies the other.
  governanceGaps:
    - No `securityDefinitions` or `security` block in a spec whose entire auth model
      is OAuth2 — the auth is documented in HTML prose inside an operation description.
    - No `host` or `schemes` declared, so the contract is not self-locating.
    - Swagger 2.0 in 2026, not OpenAPI 3.x.
    - Vendor extension `pds` (hidden/extra/enumerate/deprecated) is attached to
      parameters as a raw sibling key rather than an `x-` prefixed extension, which is
      invalid under the Swagger 2.0 extension rules and will trip strict validators.
    - "Deprecation is signalled only through that non-standard `pds` object; there
      is no standard `deprecated: true` flag, no sunset headers, no changelog."
    - No webhooks; event subscriptions deliver by email only.

sources:
  - url: https://api.pricefinder.com.au/v1/swagger.json
    type: OpenAPI
    status: 200
    note: Full Swagger 2.0 contract, served anonymously. Primary evidence for every
      endpoint, tag and auth claim above.
  - url: https://api.pricefinder.com.au/v1/swagger.yaml
    type: OpenAPI
    status: 200
    note: YAML serialization of the same contract.
  - url: https://api.pricefinder.com.au/v1/swagger/index.html
    type: APIReference
    status: 200
    note: Live public Swagger UI. The de facto developer portal.
  - url: https://api.pricefinder.com.au/v1/auth/authorize.html
    type: Authentication
    status: 200
    note: Hosted OAuth2 authorization page ("PriceFinder Login").
  - url: https://www.pricefinder.com.au/api/
    type: Documentation
    status: 301
    note: Redirects to /get-started/ — the marketing API page is now the sales funnel.
  - url: https://www.pricefinder.com.au/get-started/
    type: SignUp
    status: 200
    note: Industry-segmented contact funnel. "Custom plans designed to suit your
      business / Contact sales". Evidence for the application-approval gate.
  - url: https://www.pricefinder.com.au/our-data/
    type: Documentation
    status: 200
    note: Data provenance — Domain and Allhomes first-party feeds, government land
      valuation data for ACT/SA/QLD/NSW/TAS/NT, 14M+ properties, 30+ years of sales
      history. Evidence for the no-open-data finding.
  - url: https://www.pricefinder.com.au/integrations/
    type: Integrations
    status: 200
    note: Partner directory; also carries the "© 2025, CoStar Group Inc." footer.
  - url: https://www.domain.com.au/group/api-terms-and-conditions/
    type: TermsOfService
    status: 403
    note: Declared by the API itself in `info.license.url`. Not directly retrievable
      from this environment (domain.com.au also sits behind edge bot protection), but
      it is the provider's own stated licence for API use.
  - url: https://help.pricefinder.com.au/
    type: Support
    status: 403
    note: Zendesk help centre; blocked to this crawler. Public articles reference API
      users continuing to use their "Swagger page credentials" after a login change.
  - url: https://github.com/realhub/pricefinder-ruby
    type: SDK
    note: Third-party Ruby client, not published or endorsed by Pricefinder. Confirms
      the client_id/client_secret = username/password credential model.
