    definitions: 188
    parses: true
    verbatim: true
  - path: openapi/pricefinder-api-swagger.yml
    sourceURL: https://api.pricefinder.com.au/v1/swagger.yaml
    httpStatus: 200
    contentType: application/yaml
    bytes: 432953
    fetchedDate: '2026-07-26'
    format: Swagger 2.0 (YAML serialization of the same contract)
    paths: 112
    parses: true
