source: |
  Registry probes (npm, PyPI, RubyGems, Packagist, crates.io, Maven Central, NuGet,
  pkg.go.dev) plus the Pricefinder contract's own /stubs/{language} code-generation
  operation, harvested 2026-07-26.

summary: |
  Pricefinder publishes no supported, versioned client library to any public package
  registry under its own or Domain Group's name. What it does ship is a first-party
  CLIENT-LIBRARY GENERATOR built into the API itself: GET /v1/stubs/{language}
  (operationId generateStub) returns a swagger-codegen ZIP for any of 38 target
  languages. It is first-party (served from api.pricefinder.com.au, described in
  Pricefinder's own Swagger 2.0 contract), but the contract states plainly that
  "Pricefinder is unable to provide support for this endpoint, it is provided as a
  convenience. There is no guarantee of backwards compatibility for this method."
  It is also auth-gated — an anonymous GET returns HTTP 401 (probed 2026-07-26).
  Everything on a public registry is third-party.

generator:
  official: true
  supported: false
  operation: generateStub
  method: GET
  url: https://api.pricefinder.com.au/v1/stubs/{language}
  source_operation: openapi/pricefinder-api-swagger.json#generateStub
  produces: application/zip
  toolchain: swagger-codegen (inferred from the target-language enum, which is the
    swagger-codegen 2.x generator list verbatim)
  anonymous_probe:
    url: https://api.pricefinder.com.au/v1/stubs/java
