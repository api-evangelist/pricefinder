summary: |
  Pricefinder serves NO /.well-known/ discovery surface on either host. Every RFC
  8615 well-known path probed returned 404 on the API host (api.pricefinder.com.au)
  and 403 on the marketing host (www.pricefinder.com.au, which sits behind Akamai Bot
  Manager and returns 403 to any client without a full browser header set — the 403s
  below are edge denials, not evidence a document exists).

  Notably absent given the API is entirely OAuth 2.0:
  no /.well-known/openid-configuration (OIDC discovery), and no
  /.well-known/oauth-authorization-server (RFC 8414 authorization-server metadata).
  The OAuth 2.0 token endpoint, the three grant types and the hosted authorize page
  are documented only in HTML prose inside the POST /oauth2/token operation
  description in the Swagger 2.0 contract. There is no machine-readable authorization
  server metadata anywhere.

  No security.txt (RFC 9116), no api-catalog (RFC 9727), no ai-plugin.json.
  Because no document was retrieved, no raw files are saved and no WellKnown or
  SecurityTxt pointer is wired into apis.yml — absence is the finding.

