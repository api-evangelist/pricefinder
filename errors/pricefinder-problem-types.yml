error_schemas:
- name: Error
  shape: '{ "error": string }'
  documented_uses: 1
  note: A single untyped string. No code, no type URI, no field pointer, no
    correlation id, no remediation link.

partial_success_channel:
  schema: Message
  shape: '{ "code": integer(int64), "text": string }'
  references: 39
  carried_on: 200 responses, as a `messages` array on Property, Sale, Listing,
    Suburb, PropertyIdentifiers and most other top-level entities
  significance: |
    THIS IS WHERE PRICEFINDER'S REAL ERROR SEMANTICS LIVE, and it is not an HTTP
    status channel at all. Data-quality notices, suppressed-field notices and
    partial-result warnings ride inside a 200 as `messages[]`. The `code` values are
    not enumerated or documented anywhere in the contract. Any agent that branches
    only on HTTP status will silently treat a degraded or legally-suppressed answer
    as a complete one.
  agent_guidance: |
    Always read `messages[]` on a 200. Treat a non-empty `messages` array as a signal
    that the payload may be incomplete or jurisdictionally redacted — check
    SensitivePrice / SensitiveDate fields before presenting them as fact.

missing:
