source: |
  openapi/pricefinder-api-swagger.json 4xx/5xx responses, plus live anonymous probes
  of api.pricefinder.com.au recorded 2026-07-26. Pricefinder publishes no error
  reference page anywhere — there is no docs surface to search, so nothing could be
  upgraded to `searched`.
format: none — not RFC 9457, not RFC 7807
media_type: application/json (no application/problem+json anywhere in the contract)

summary: |
  The weakest part of an otherwise complete contract. Across 116 operations
  Pricefinder documents exactly THREE non-2xx responses. 97 operations declare only a
  200; 19 declare only a bare `default: successful operation`. No operation declares
  the 401 that every one of them actually returns without a token, no 403 for
  entitlement failure, no 429 for rate limiting, and no 5xx anywhere. There is no
  error-code registry, no problem-type URI space, and no remediation guidance. A
  client cannot generate error handling from this contract.

