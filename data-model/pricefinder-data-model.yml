observations:
- |
  SensitivePrice and SensitiveDate are the most interesting shapes in the model. Sale
  price and sale date are not plain scalars: they are wrapped types that can be
  withheld, because Australian state legislation differs on what transaction detail
  may be republished. The data model encodes jurisdictional disclosure law directly.
- |
  Every entity carries `disclaimer` and `messages`. A caller cannot render Pricefinder
  data without also carrying its licensing text and its data-quality notices —
  redistribution constraints are part of the payload, not just the contract.
- |
  There is no write path into the graph. The only POSTs are a token request, three
  event-subscription creates, a street-view image request and a CMA event save. Agents
  cannot create or mutate a property, sale, listing or valuation.

