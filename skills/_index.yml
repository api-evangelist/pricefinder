- Read messages[] on every 200; data-quality and jurisdictional-suppression notices
  ride inside success payloads.
- There is no pagination; `limit` caps results with no way to reach the next page.
  Partition the query and union client-side.
- There is no idempotency key on any write. Read state back rather than blind-retrying.
- Prefer min_*/max_* filters; the _gt/_lt generation is deprecated on 47 operations.
- SensitivePrice and SensitiveDate may be legally withheld; carry `disclaimer` through
  to anything rendered.

